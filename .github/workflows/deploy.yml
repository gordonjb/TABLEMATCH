name: Deploy

on:
  # Run this workflow whenever a new commit is pushed to main.
  push: {branches: [main]}
  # Run this workflow every 5 days, at 10:15 UTC (to avoid losing web cache)
  schedule: [{cron: "15 10 */5 * *"}]
  # Run this workflow when triggered manually in GitHub’s UI.
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        env:
            cache-name: cache-cagematch
        with:
            path: |
                ./py/cagematch_cache.sqlite
                ./py/cagematchcache
            key: ${{ runner.os }}-cmcache
      - uses: astral-sh/setup-uv@v7
        with:
            working-directory: py
            enable-cache: true
      - uses: actions/setup-node@v7
        with:
            node-version: 22
            cache: npm
      - uses: opt-nc/setup-duckdb-action@v1.2.12
        with:
            version: v1.2.2
      - name: Install playwright
        working-directory: py
        run: uv run playwright install --with-deps
      - name: Parse URLs to JSON
        working-directory: py
        run: uv run main.py shows.yaml out
      - name: Install Observable dependencies
        run: npm ci
      - name: Build Observable static site
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
